directories:
  output: release
  buildResources: assets
appId: com.example.x
files:
  - filter:
      - ../frontend/dist/**/*
      - ../backend/**/*
      - main.js
      - preload.js
      - package.json
extraResources:
  - from: ../backend
    to: backend
    filter:
      - '**/*'
win:
  target: nsis
mac:
  target: dmg
electronVersion: 36.2.1
